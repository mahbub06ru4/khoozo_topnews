name: Update live news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Google News BD RSS
        run: node scripts/fetch-news.js

      - name: Validate JSON
        run: node -e "for (const f of ['news','sports']) JSON.parse(require('fs').readFileSync('data/'+f+'.json','utf8'))"

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/sports.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/sports.json
          git commit -m "chore: update live news [skip ci]"
          git pull --rebase --autostash
          git push
